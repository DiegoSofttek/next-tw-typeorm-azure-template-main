version: "3.9"
services:
  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "YourPassword123!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Azurite (Storage emulator)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azuritedata:/data

volumes:
  sqldata:
  azuritedata:
